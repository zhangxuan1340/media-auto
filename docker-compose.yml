# MediaAuto — Web 控制台 + 同步作业
#
# 配置只存数据库(data/media_auto.db 的 app_config 表), 没有配置文件参与:
#   首次启动播种默认值 → 走「初始化引导」; 之后只在「管理 → 通用」页改。
#
# 全新部署:
#   docker compose up -d --build
#   → 打开 http://<NAS>:8787 → 登录默认账号 → 走首次初始化引导
#
services:
  media-auto:
    build: .
    image: media-auto:latest
    container_name: media-auto
    restart: unless-stopped
    ports:
      - "8787:8787"
    # 仅这两个会覆盖 config.web.auth(留空会把账号清空, 故默认注释掉)
    # environment:
    #   WEB_USER: admin
    #   WEB_PASS: change_me
    volumes:
      - ./data:/app/data   # SQLite(含配置 app_config)+ 图片缓存(WAL, 必须本地盘)
      - ./state:/app/state # 队列状态 state/queue.json
