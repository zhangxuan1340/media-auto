# MediaAuto — Web 控制台 + 同步作业
#
# 配置真相源是数据库(data/media_auto.db 的 app_config 表), 配置文件只作首启一次性导入源, 
# 「首次导入 + 手工备份」, 由 Web「管理 → 通用」页读写即可, 不用改文件。
#
# 全新部署:
#   docker compose up -d --build
#   → 打开 http://<NAS>:8787 → 登录默认账号 → 走首次引导
#
# 老部署一次性迁移(只做一次, 导入完该文件不再被读):
#   mkdir -p config && mv config.json config/config.json
#   docker compose up -d --build
#   首次启动把 config/config.json 一次性导入数据库(不会再问引导, 之后只读库)。
services:
  media-auto:
    build: .
    image: media-auto:latest
    container_name: media-auto
    restart: unless-stopped
    ports:
      - "8787:8787"
    # 仅这两个会覆盖 config.web.auth(留空会把账号清空, 故默认注释掉)
    # environment:
    #   WEB_USER: admin
    #   WEB_PASS: change_me
    volumes:
      # 目录挂载(不是文件): 宿主机缺这个目录时 Docker 会自动建成目录,
      # 不会再出现"文件不存在 → 被挂成目录 → mount not a directory"的坑。
      - ./config:/app/config
      - ./data:/app/data   # SQLite(含配置 app_config)+ 图片缓存(WAL, 必须本地盘)
      - ./state:/app/state # 队列状态 state/queue.json
