<!-- MediaAuto 导航栏「四大金刚」tab 图标 sprite(2026-10-04 从 index.html 内联拆出)
     用法: <svg class="icn tab-ic"><use href="/icons/tab-icons.svg#i-movie"/></svg>
     每个 symbol 用 currentColor 描边, 由 <use> 处继承页面颜色(激活蓝/非激活灰/hover), 不能用 <img> 加载(会锁死颜色) -->
<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <symbol id="i-movie" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="20" height="20" rx="2.18"/>
    <path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5"/>
  </symbol>
  <symbol id="i-tv" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="7" width="20" height="14" rx="2"/>
    <path d="m17 2-5 5-5-5"/>
  </symbol>
  <symbol id="i-organize" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>
  </symbol>
  <symbol id="i-manage" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="21" y1="4" x2="14" y2="4"/><line x1="10" y1="4" x2="3" y2="4"/>
    <line x1="21" y1="12" x2="12" y2="12"/><line x1="8" y1="12" x2="3" y2="12"/>
    <line x1="21" y1="20" x2="14" y2="20"/><line x1="12" y1="20" x2="3" y2="20"/>
    <line x1="14" y1="2" x2="14" y2="6"/><line x1="8" y1="10" x2="8" y2="14"/><line x1="16" y1="18" x2="16" y2="22"/>
  </symbol>
</svg>
